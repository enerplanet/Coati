[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enerplanet-coati"
dynamic = ["version"]
description = "Convert netCDF and HDF5 result files of Calliope, PyPSA and AdOpT-NET0 to JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Willibald Weber" }]
maintainers = [{ name = "BigGeoData & Spatial AI, Technische Hochschule Deggendorf" }]
keywords = [
    "adopt-net0",
    "calliope",
    "energy-system-modelling",
    "hdf5",
    "json",
    "netcdf",
    "pypsa",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: File Formats :: JSON",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "h5py>=3.8",
    "numpy>=1.23",
]

[project.optional-dependencies]
# Decoding of the YAML documents Calliope embeds in its files (`coati dump --decode-text`).
yaml = ["pyyaml>=6.0"]
# The tests write their files with the libraries that the frameworks write theirs with,
# and compare what Coati reads with what these libraries read.
test = [
    "hypothesis>=6.100",
    "jsonschema>=4.18",
    "netCDF4>=1.6.5",
    "packaging>=23.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "tomli>=2.0; python_version < '3.11'",
    "xarray>=2024.1",
]
# The versions are those that the checks were last made to pass with: a new version of
# a tool may format or judge the same code differently.
lint = [
    "mypy>=2.3,<2.4",
    "ruff>=0.16.9,<0.17",
    "types-PyYAML>=6.0",
]
# The same as docs/requirements.txt, which the workflow of the documentation installs.
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.0",
    "ruff>=0.16.9,<0.17",
]
dev = [
    "build>=1.2",
    "enerplanet-coati[docs,lint,test,yaml]",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/enerplanet/Coati"
Documentation = "https://enerplanet.github.io/Coati"
Repository = "https://github.com/enerplanet/Coati"
Issues = "https://github.com/enerplanet/Coati/issues"
Changelog = "https://github.com/enerplanet/Coati/blob/main/CHANGELOG.md"

[project.scripts]
coati = "coati.cli:main"

[tool.hatch.version]
path = "src/coati/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/coati"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/mkdocs.yml",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/ATTRIBUTIONS.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/Makefile",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
xfail_strict = true
filterwarnings = [
    "error",
    # The netCDF library, which writes the files of the tests, sets the shape of arrays.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    # Compiled modules built for another version of NumPy than the installed one.
    "ignore:numpy.(ndarray|dtype|ufunc) size changed:RuntimeWarning",
]
markers = [
    "frameworks: needs a modelling framework (calliope, pypsa or adopt_net0) and a solver; skipped when absent",
]

[tool.coverage.run]
source_pkgs = ["coati"]
branch = true

[tool.coverage.paths]
source = ["src/coati", "*/site-packages/coati"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The scripts of the workflows are those of the template of the organisation.
extend-exclude = [".github"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "ISC",  # implicit string concatenation
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D105",  # magic methods document themselves
    "D107",  # __init__ is documented in the class docstring
    "D203",  # conflicts with D211 (no blank line before class docstring)
    "D213",  # conflicts with D212 (summary on the first line)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",     # tests are named, not documented
    "S101",  # assert is the point of a test
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# No python_version: the stubs of NumPy use the syntax of the interpreter they are
# installed for. The oldest supported Python is covered by the tests and by ruff.
files = ["src/coati"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true
